# MicrOasis 2026 — App Store / landing-page screenshot definitions.
#
# Each shot is rendered once per language. A line maps directly to simulator
# `defaults` keys the app reads (microasis.*), so there is no UI tapping involved.
# Run with:  python3 make_screenshots.py            (all shots, all languages)
#            python3 make_screenshots.py --only 05  (just matching shots)
#            python3 make_screenshots.py --no-build --lang hu
#
# Pre-requisite: Xcode (full, not just Command Line Tools). The harness finds it
# automatically. The shots use the app's built-in debug overrides, which are
# compiled into Debug simulator builds and no-op in App Store builds.

api: https://microasis.torma.ai/api/schedule   # source of truth for stage lat,lng
out_dir: .                                        # language sub-folders created here
settle: 7                                         # seconds to wait after launch before capture
appearance: dark                                  # simulator UI style (status bar glyphs)
status_bar:                                       # clean marketing status bar (iOS; watch ignores it)
  time: "9:41"
  battery: 100
  cellular: 4
  wifi: 3

languages: [hu, en]                               # every shot is captured in each

# Logical devices referenced by each shot's `device:` key.
devices:
  iphone:
    name: "iPhone 17 Pro Max"                     # 6.9" App Store slot (1320×2868) —
                                                  # the size App Store Connect now
                                                  # requires; 6.5" alone is rejected
    platform: ios
    scheme: MicrOasis
    bundle: ai.torma.microasis.2026
  watch:
    name: "Apple Watch Ultra 3 (49mm)"            # 422×514 watch slot
    platform: watchos
    scheme: MicrOasisWatch
    bundle: ai.torma.microasis.2026.watchkitapp

# view:     timetable | now | share | settings  (iPhone tab / sheet to open)
#           widget                                (render widget card(s) full-screen —
#                                                  watch: one stage's Smart Stack card;
#                                                  iPhone: medium + small home widget)
# stage:    stage slug, required for view: widget -> microasis.startWidgetPreview
#           (iPhone takes "medium,small" slugs, e.g. "oasis,wadi")
# time:     "yyyy-MM-dd HH:mm" Budapest-local -> microasis.debugNow
# location: stage slug -> that stage's lat,lng -> microasis.debugCoord (selects the
#           nearest stage: left column on iPhone, shown stage on watch). Omit for
#           "no stage nearby".
# columns:  iPhone timetable zoom (1…5) -> microasis.columns  (default 3)
# font:     text-size zoom (1…5)         -> microasis.fontSize (default 3)
# empty:    true -> watch: force the "nothing on" card  (microasis.startNoProgram)
# favorites: comma-separated event slugs -> microasis.startFavorites (red hearts;
#            per-launch only, nothing persists; slugs must be acts visible at
#            the shot's `time` — check the live API /api/schedule for slugs).
#            The harness pins the key on EVERY shot (omitted -> empty -> no
#            hearts) and its presence disables WCSession sync, so a paired
#            simulator can never bleed favorites into a shot.
# favfilter: true -> microasis.startFavFilter (timetable favorites dim-filter:
#            non-favorited blocks fade, header heart fills — needs `favorites:`)
shots:
  - name: "01-timetable-thursday"
    device: iphone
    view: timetable
    time: "2026-08-20 18:40"      # opening evening, both stages running
    columns: 2
    font: 2
    favorites: "oasis-glev-rosalcodo-0820,wadi-borish-szoa-0820"

  - name: "02-timetable-friday"
    device: iphone
    view: timetable
    time: "2026-08-21 21:10"
    columns: 2
    font: 1

  - name: "03-now-friday"
    device: iphone
    view: now
    time: "2026-08-21 21:00"      # Lukea (Oasis) + Pau Perez (Wadi) both live
    location: oasis
    favorites: "oasis-lukea-0821"

  - name: "04-timetable-wadi"
    device: iphone
    view: timetable
    time: "2026-08-22 16:45"
    columns: 1
    location: wadi

  - name: "05-settings"
    device: iphone
    view: settings

  - name: "06-share"
    device: iphone
    view: share                   # the "Add tovább" QR / share tab (static content)

  - name: "07-now-camp"
    device: iphone
    view: now
    time: "2026-08-20 13:00"      # gates open, camp going up, first acts teased

  # The Yoga Terrace on its own — one wide column, so the class names and the
  # teachers stay readable. Saturday afternoon runs yoga back to back.
  - name: "08-timetable-terrace"
    device: iphone
    view: timetable
    time: "2026-08-22 14:30"
    columns: 1
    font: 2
    location: terrace

  # Home-screen widgets: medium (Oasis) + small (Wadi), both live with a
  # full up-next list at this time.
  - name: "09-widgets"
    device: iphone
    view: widget
    stage: "oasis,wadi"
    time: "2026-08-22 20:30"
    favorites: "oasis-electricano-0822,wadi-route-8-0822"

  # Saturday night with the favorites dim-filter on: the hearted acts pop,
  # everything else fades — the landing page's favorites section.
  - name: "10-favorites"
    device: iphone
    view: timetable
    time: "2026-08-22 20:15"
    columns: 2
    font: 2
    favorites: "oasis-barac-0822,oasis-electricano-0822,wadi-tolo-0822,wadi-jaffa-surfa-0822"
    favfilter: true

  - name: "01-now-oasis"
    device: watch
    time: "2026-08-22 20:15"
    location: oasis
    favorites: "oasis-barac-0822"

  - name: "02-now-wadi"
    device: watch
    time: "2026-08-21 21:30"
    location: wadi

  # The Wadi's long Sunday daytime break — a real "nothing on right now" card.
  - name: "03-now-quiet"
    device: watch
    time: "2026-08-23 12:00"
    location: wadi
    empty: true

  # Smart Stack "now playing" widget cards, rendered full-screen for marketing.
  - name: "04-widget-oasis"
    device: watch
    view: widget
    stage: oasis
    time: "2026-08-22 20:15"

  - name: "05-widget-wadi"
    device: watch
    view: widget
    stage: wadi
    time: "2026-08-21 21:00"
    favorites: "wadi-pau-perez-0821"
