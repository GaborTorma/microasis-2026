name: Manas
options:
  bundleIdPrefix: ai.torma.manas.2026
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Team (a Team ID is not a secret; safe to commit).
    DEVELOPMENT_TEAM: "5HW26FBLH4"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    # Xcode-recommended project settings (kept here so they survive regeneration).
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"

targets:
  # ── iOS / iPadOS app (embeds the watch app) ───────────────────────
  Manas:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ManasKit
      - path: Sources/Manas-iOS
    dependencies:
      - target: ManasWatch
        embed: true
    info:
      path: Sources/Manas-iOS/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "A helyzeted alapján kiválasztjuk a hozzád legközelebbi színpadot."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.manas.2026
        PRODUCT_NAME: Manas
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ── watchOS app (embedded companion) ──────────────────────────────
  ManasWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/ManasKit
      - path: Sources/Manas-watch
    info:
      path: Sources/Manas-watch/Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: ai.torma.manas.2026
        CFBundleDisplayName: Manas
        NSLocationWhenInUseUsageDescription: "A helyzeted alapján kiválasztjuk a hozzád legközelebbi színpadot."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.manas.2026.watchkitapp
        PRODUCT_NAME: ManasWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
