name: Manas
options:
  bundleIdPrefix: ai.torma.manas.2026
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Team (a Team ID is not a secret; safe to commit).
    DEVELOPMENT_TEAM: "5HW26FBLH4"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    # Xcode-recommended project settings (kept here so they survive regeneration).
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"

targets:
  # ── iOS / iPadOS app (embeds the watch app) ───────────────────────
  Manas:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ManasKit
      - path: Sources/Manas-iOS
    dependencies:
      - target: ManasWatch
        embed: true
    info:
      path: Sources/Manas-iOS/Info.plist
      properties:
        # Feed the single-source-of-truth build settings into the bundle.
        # Without these (and with no GENERATE_INFOPLIST_FILE) an explicit
        # Info.plist would hardcode the version and the settings.base bump
        # would never reach the binary.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "A helyzeted alapján kiválasztjuk a hozzád legközelebbi színpadot."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.manas.2026
        PRODUCT_NAME: Manas
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ── watchOS app (embedded companion, embeds the widget extension) ──
  ManasWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/ManasKit
      - path: Sources/Manas-watch
    dependencies:
      - target: ManasWatchWidget
        embed: true
    info:
      path: Sources/Manas-watch/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: ai.torma.manas.2026
        CFBundleDisplayName: Manas
        NSLocationWhenInUseUsageDescription: "A helyzeted alapján kiválasztjuk a hozzád legközelebbi színpadot."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.manas.2026.watchkitapp
        PRODUCT_NAME: ManasWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ── watchOS widgets (Smart Stack + watch-face complications) ───────
  # WidgetKit extension embedded in the watch app. One configurable
  # "now playing" rectangular widget (pin each instance to a stage and
  # scroll the Smart Stack between them) + a small launcher complication.
  ManasWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/ManasKit
      - path: Sources/Manas-watch-widget
    info:
      path: Sources/Manas-watch-widget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Manas
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.manas.2026.watchkitapp.widget
        PRODUCT_NAME: ManasWatchWidget
