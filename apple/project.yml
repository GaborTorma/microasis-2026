name: MicrOasis
options:
  bundleIdPrefix: ai.torma.microasis.2026
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Team (a Team ID is not a secret; safe to commit).
    DEVELOPMENT_TEAM: "5HW26FBLH4"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    # Xcode-recommended project settings (kept here so they survive regeneration).
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"

targets:
  # ── iOS / iPadOS app (embeds the watch app) ───────────────────────
  MicrOasis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/OasisKit
      - path: Sources/MicrOasis-iOS
    dependencies:
      - target: MicrOasisWatch
        embed: true
      - target: MicrOasisWidget
        embed: true
    # App Group: share the chosen language, the QA debug clock and the schedule
    # disk cache (+ .etag sidecar) with the home-screen widget extension.
    entitlements:
      path: Sources/MicrOasis-iOS/MicrOasis.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.torma.microasis.2026
    info:
      path: Sources/MicrOasis-iOS/Info.plist
      properties:
        # Feed the single-source-of-truth build settings into the bundle.
        # Without these (and with no GENERATE_INFOPLIST_FILE) an explicit
        # Info.plist would hardcode the version and the settings.base bump
        # would never reach the binary.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # On-device name (home screen, app switcher, Safari "‹ <app>" back button).
        # Kept short so the home-screen label doesn't truncate; the App Store
        # listing name is the longer "Guide for MicrOasis 2026".
        CFBundleDisplayName: MicrOasis
        # Widget → app deep links (microasis://stage/<slug>), see AppLinks.scheme.
        CFBundleURLTypes:
          - CFBundleURLName: ai.torma.microasis.2026
            CFBundleURLSchemes: [microasis]
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "A helyzeted alapján kiválasztjuk a hozzád legközelebbi színpadot."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.microasis.2026
        PRODUCT_NAME: MicrOasis
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ── watchOS app (embedded companion, embeds the widget extension) ──
  MicrOasisWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/OasisKit
      - path: Sources/MicrOasis-watch
    dependencies:
      - target: MicrOasisWatchWidget
        embed: true
    # App Group: share the chosen language and the schedule disk cache
    # (+ .etag sidecar) with the embedded widget extension.
    entitlements:
      path: Sources/MicrOasis-watch/MicrOasisWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.torma.microasis.2026
    info:
      path: Sources/MicrOasis-watch/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: ai.torma.microasis.2026
        CFBundleDisplayName: MicrOasis
        NSLocationWhenInUseUsageDescription: "A helyzeted alapján kiválasztjuk a hozzád legközelebbi színpadot."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.microasis.2026.watchkitapp
        PRODUCT_NAME: MicrOasisWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ── iOS home-screen widgets ────────────────────────────────────────
  # WidgetKit extension embedded in the iOS app. The same configurable
  # per-stage "now playing" widget as the watch, in the three home-screen
  # sizes (small / medium / large). Provider + intent come from
  # Sources/MicrOasis-widget-shared, shared with the watch extension.
  MicrOasisWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/OasisKit
      - path: Sources/MicrOasis-widget-shared
      - path: Sources/MicrOasis-iOS-widget
    # App Group: read the iOS app's chosen language (shared UserDefaults)
    # and its schedule disk cache.
    entitlements:
      path: Sources/MicrOasis-iOS-widget/MicrOasisWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.torma.microasis.2026
    info:
      path: Sources/MicrOasis-iOS-widget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: MicrOasis
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.microasis.2026.widget
        PRODUCT_NAME: MicrOasisWidget
        TARGETED_DEVICE_FAMILY: "1"

  # ── watchOS widgets (Smart Stack + watch-face complications) ───────
  # WidgetKit extension embedded in the watch app. One configurable
  # "now playing" rectangular widget (pin each instance to a stage and
  # scroll the Smart Stack between them) + a small launcher complication.
  MicrOasisWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/OasisKit
      - path: Sources/MicrOasis-widget-shared
      - path: Sources/MicrOasis-watch-widget
    # App Group: read the watch app's chosen language (shared UserDefaults)
    # and its schedule disk cache.
    entitlements:
      path: Sources/MicrOasis-watch-widget/MicrOasisWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.torma.microasis.2026
    info:
      path: Sources/MicrOasis-watch-widget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: MicrOasis
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.microasis.2026.watchkitapp.widget
        PRODUCT_NAME: MicrOasisWatchWidget

# Shared schemes, declared so `xcodegen generate` emits them deterministically —
# XcodeGen does not create schemes on its own, so they are declared here.
# Without them, headless `xcodebuild -scheme …` and the screenshot harness have
# nothing to build.
schemes:
  MicrOasis:
    build:
      targets:
        MicrOasis: all
    run:
      config: Debug
    archive:
      config: Release
  MicrOasisWatch:
    build:
      targets:
        MicrOasisWatch: all
    run:
      config: Debug
    archive:
      config: Release
