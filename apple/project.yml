name: Manas
options:
  bundleIdPrefix: ai.torma.manas.2026
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.3.0"
    CURRENT_PROJECT_VERSION: "13"
    CODE_SIGN_STYLE: Automatic
    # Apple Developer Team (a Team ID is not a secret; safe to commit).
    DEVELOPMENT_TEAM: "5HW26FBLH4"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    # Xcode-recommended project settings (kept here so they survive regeneration).
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"

targets:
  # ── iOS / iPadOS app (embeds the watch app) ───────────────────────
  Manas:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ManasKit
      - path: Sources/Manas-iOS
    dependencies:
      - target: ManasWatch
        embed: true
      - target: ManasWidget
        embed: true
    # App Group: share the chosen language, the QA debug clock and the schedule
    # disk cache (+ .etag sidecar) with the home-screen widget extension.
    entitlements:
      path: Sources/Manas-iOS/Manas.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.torma.manas.2026
    info:
      path: Sources/Manas-iOS/Info.plist
      properties:
        # Feed the single-source-of-truth build settings into the bundle.
        # Without these (and with no GENERATE_INFOPLIST_FILE) an explicit
        # Info.plist would hardcode the version and the settings.base bump
        # would never reach the binary.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # On-device name (home screen, app switcher, Safari "‹ <app>" back button).
        # Kept short so the home-screen label doesn't truncate; the App Store
        # listing name is the longer "Guide for MANAS 2026".
        CFBundleDisplayName: "MANAS 2026"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "A helyzeted alapján kiválasztjuk a hozzád legközelebbi színpadot."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.manas.2026
        PRODUCT_NAME: Manas
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ── watchOS app (embedded companion, embeds the widget extension) ──
  ManasWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/ManasKit
      - path: Sources/Manas-watch
    dependencies:
      - target: ManasWatchWidget
        embed: true
    # App Group: share the chosen language and the schedule disk cache
    # (+ .etag sidecar) with the embedded widget extension.
    entitlements:
      path: Sources/Manas-watch/ManasWatch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.torma.manas.2026
    info:
      path: Sources/Manas-watch/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: ai.torma.manas.2026
        CFBundleDisplayName: Manas
        NSLocationWhenInUseUsageDescription: "A helyzeted alapján kiválasztjuk a hozzád legközelebbi színpadot."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.manas.2026.watchkitapp
        PRODUCT_NAME: ManasWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  # ── iOS home-screen widgets ────────────────────────────────────────
  # WidgetKit extension embedded in the iOS app. The same configurable
  # per-stage "now playing" widget as the watch, in the three home-screen
  # sizes (small / medium / large). Provider + intent come from
  # Sources/Manas-widget-shared, shared with the watch extension.
  ManasWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ManasKit
      - path: Sources/Manas-widget-shared
      - path: Sources/Manas-iOS-widget
    # App Group: read the iOS app's chosen language (shared UserDefaults)
    # and its schedule disk cache.
    entitlements:
      path: Sources/Manas-iOS-widget/ManasWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.torma.manas.2026
    info:
      path: Sources/Manas-iOS-widget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "MANAS 2026"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.manas.2026.widget
        PRODUCT_NAME: ManasWidget
        TARGETED_DEVICE_FAMILY: "1"

  # ── watchOS widgets (Smart Stack + watch-face complications) ───────
  # WidgetKit extension embedded in the watch app. One configurable
  # "now playing" rectangular widget (pin each instance to a stage and
  # scroll the Smart Stack between them) + a small launcher complication.
  ManasWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/ManasKit
      - path: Sources/Manas-widget-shared
      - path: Sources/Manas-watch-widget
    # App Group: read the watch app's chosen language (shared UserDefaults)
    # and its schedule disk cache.
    entitlements:
      path: Sources/Manas-watch-widget/ManasWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.torma.manas.2026
    info:
      path: Sources/Manas-watch-widget/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: Manas
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.torma.manas.2026.watchkitapp.widget
        PRODUCT_NAME: ManasWatchWidget

# Shared schemes, declared so `xcodegen generate` emits them deterministically —
# XcodeGen does not create schemes on its own, and the previously-present ones were
# an Xcode-created artifact that didn't survive a clean regenerate. Without these,
# headless `xcodebuild -scheme …` and the screenshot harness have nothing to build.
schemes:
  Manas:
    build:
      targets:
        Manas: all
    run:
      config: Debug
    archive:
      config: Release
  ManasWatch:
    build:
      targets:
        ManasWatch: all
    run:
      config: Debug
    archive:
      config: Release
